name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published coordinated module version
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  public-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Verify independent public modules and their combined graph
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GOWORK: 'off'
        run: go run ./tools/consumercheck -version "$RELEASE_VERSION"
      - name: Record selected versions and public checksums
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .artifacts/public-consumers.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
