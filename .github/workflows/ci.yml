name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  minimum-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - run: GOWORK=off GOTOOLCHAIN=local go test -race ./...

  minimum-driver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: driver/launchdarklyfeature
            go: '1.25.x'
          - module: driver/openfeaturefeature
            go: '1.26.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: GOWORK=off GOTOOLCHAIN=local go -C '${{ matrix.module }}' test -race ./...

  quality:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check formatting, module inventory, and tidy parity
        run: |
          test -z "$(gofmt -l .)"
          make modules-check tidy
          git diff --exit-code -- go.mod go.sum '**/go.mod' '**/go.sum'
      - name: Require exact full unit coverage across every runtime module
        run: make test-unit
      - name: Check races and vet every module
        run: make test-race vet
      - name: Verify executable documentation and generated parity
        run: |
          make test-tools generate check-generated
          git diff --exit-code -- README.md docs/unit-results.json docs/assets
      - name: Check optional Codecov configuration
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload unit-only coverage
        if: steps.codecov.outputs.configured == 'true'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .artifacts/unit.cover
          flags: unit
          disable_search: true
          fail_ci_if_error: true
