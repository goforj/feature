name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  vulnerability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Scan the runtime library on the current patched toolchain
        run: |
          for module in . driver/launchdarklyfeature driver/openfeaturefeature; do
            (cd "$module" && GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 .)
          done
